name: Local runner tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate example task
        run: python -m physicsbench validate-task --case cases/case30
      - name: Run command-line smoke without model access
        run: python -m physicsbench run --case cases/case30 --case-id Case30 --config configs/smoke.json --output state/ci-smoke --smoke-wall-seconds 10
      - name: Test runner without model access
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Bash adapter without model access
        run: node --test --test-isolation=none tests/test_bash_adapter.mjs
